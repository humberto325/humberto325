<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 320" width="900" height="320" role="img" aria-labelledby="title desc">
  <title id="title">Architecture of an AI agent</title>
  <desc id="desc">The lead message comes in over WhatsApp or SMS, goes through an n8n webhook to the LLM agent, which takes actions in the CRM, the calendar and Slack.</desc>
  <defs>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <linearGradient id="core" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
    <path id="r1" d="M180 165 L640 165 C680 165 680 75 720 75"/>
    <path id="r2" d="M180 165 L720 165"/>
    <path id="r3" d="M180 165 L640 165 C680 165 680 255 720 255"/>
  </defs>
  <style>
    .label { font: 600 15px 'Segoe UI', Helvetica, Arial, sans-serif; fill: #e6edf3; }
    .sub { font: 400 11.5px Consolas, 'Courier New', monospace; fill: #8b98a6; }
    .tag { font: 400 12px Consolas, 'Courier New', monospace; fill: #22d3ee; }
    .box { fill: #121821; stroke: #2a3a4d; stroke-width: 1.3; }
    .rail { fill: none; stroke: #1f2c3a; stroke-width: 2; }
    .flow { fill: none; stroke: #22d3ee; stroke-width: 2; stroke-dasharray: 6 10; animation: flow 1.2s linear infinite; opacity: 0; animation-name: flow, show; animation-duration: 1.2s, .6s; animation-iteration-count: infinite, 1; animation-fill-mode: none, forwards; }
    .node { opacity: 0; animation: pop .6s cubic-bezier(.2,.8,.2,1) forwards; }
    .n1 { animation-delay: .1s; } .n2 { animation-delay: .5s; } .n3 { animation-delay: .9s; }
    .n4 { animation-delay: 1.3s; } .n5 { animation-delay: 1.45s; } .n6 { animation-delay: 1.6s; }
    .f1 { animation-delay: 0s, .4s; } .f2 { animation-delay: 0s, .8s; } .f3 { animation-delay: 0s, 1.2s; }
    .pulse { animation: pulse 2.4s ease-in-out infinite; }
    .packet { fill: #e6fcff; filter: url(#glow); }
    @keyframes flow { to { stroke-dashoffset: -32; } }
    @keyframes show { to { opacity: .85; } }
    @keyframes pop { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
    @keyframes pulse { 0%, 100% { stroke-opacity: .55; stroke-width: 1.5; } 50% { stroke-opacity: 1; stroke-width: 3; } }
    @media (prefers-reduced-motion: reduce) { .flow, .node, .pulse { animation: none; opacity: 1; } .packet { display: none; } }
  </style>

  <rect x="1" y="1" width="898" height="318" rx="14" fill="#0b0f14" stroke="#223041"/>
  <text class="tag" x="24" y="30">ai agent · pipeline</text>
  <circle cx="862" cy="25" r="4" fill="#46c37b"><animate attributeName="opacity" values="1;.3;1" dur="1.6s" repeatCount="indefinite"/></circle>
  <text class="sub" x="852" y="29" text-anchor="end">live</text>

  <!-- rails (static) + animated flow on top -->
  <path class="rail" d="M180 165 H250 M410 165 H480 M640 165 C680 165 680 75 720 75 M640 165 H720 M640 165 C680 165 680 255 720 255"/>
  <path class="flow f1" d="M180 165 H250"/>
  <path class="flow f2" d="M410 165 H480"/>
  <path class="flow f3" d="M640 165 C680 165 680 75 720 75 M640 165 H720 M640 165 C680 165 680 255 720 255"/>

  <!-- packets travel the full route; boxes are drawn after them so packets pass "through" each node -->
  <circle class="packet" r="4.5"><animateMotion dur="3s" begin="2s" repeatCount="indefinite"><mpath href="#r1"/></animateMotion></circle>
  <circle class="packet" r="4.5"><animateMotion dur="3s" begin="3s" repeatCount="indefinite"><mpath href="#r2"/></animateMotion></circle>
  <circle class="packet" r="4.5"><animateMotion dur="3s" begin="4s" repeatCount="indefinite"><mpath href="#r3"/></animateMotion></circle>

  <g class="node n1"><rect class="box" x="20" y="130" width="160" height="70" rx="35"/><text class="label" x="100" y="161" text-anchor="middle">Lead</text><text class="sub" x="100" y="181" text-anchor="middle">WhatsApp · SMS</text></g>
  <g class="node n2"><rect class="box" x="250" y="130" width="160" height="70" rx="10"/><text class="label" x="330" y="161" text-anchor="middle">n8n</text><text class="sub" x="330" y="181" text-anchor="middle">webhook · buffer</text></g>
  <g class="node n3">
    <rect x="480" y="122" width="160" height="86" rx="12" fill="#121821" stroke="url(#core)" class="pulse"/>
    <text class="label" x="560" y="159" text-anchor="middle">LLM agent</text>
    <text class="sub" x="560" y="180" text-anchor="middle">tool calling</text>
  </g>
  <g class="node n4"><rect class="box" x="720" y="45" width="160" height="60" rx="10"/><text class="label" x="800" y="72" text-anchor="middle">CRM</text><text class="sub" x="800" y="91" text-anchor="middle">stages · tags</text></g>
  <g class="node n5"><rect class="box" x="720" y="135" width="160" height="60" rx="10"/><text class="label" x="800" y="162" text-anchor="middle">Calendar</text><text class="sub" x="800" y="181" text-anchor="middle">books calls</text></g>
  <g class="node n6"><rect class="box" x="720" y="225" width="160" height="60" rx="10"/><text class="label" x="800" y="252" text-anchor="middle">Slack</text><text class="sub" x="800" y="271" text-anchor="middle">human handoff</text></g>
</svg>
