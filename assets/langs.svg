    .label { font: 500 11px Consolas, 'Courier New', monospace; fill: #8b98a6; }
    .mono { font: 700 20px Consolas, 'Courier New', monospace; fill: #22d3ee; letter-spacing: .5px; }
    @keyframes pop { from { opacity: 0; transform: translateY(10px) scale(.85); } to { opacity: 1; transform: none; } }
    @keyframes ring { 0%, 70%, 100% { opacity: 0; } 15% { opacity: 1; } }
    @media (prefers-reduced-motion: reduce) { .t { animation: none; opacity: 1; } .ring { animation: none; } }
