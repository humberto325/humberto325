<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mini Citas - Registro</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="login-container">
    <div class="login-box">
      <div class="logo-section">
        <div class="logo-icon">
          <i class="fas fa-heart"></i>
        </div>
        <h1>Únete a Mini Citas</h1>
        <p class="tagline">Crea tu cuenta y comienza tu aventura</p>
      </div>

      <form id="registerForm" class="login-form" novalidate>
        <div class="form-group">
          <label for="name">
            <i class="fas fa-user"></i> Nombre completo
          </label>
          <input 
            type="text" 
            id="name" 
            name="name"
            placeholder="Juan Pérez" 
            autocomplete="name"
            required
            aria-describedby="name-error"
          >
          <span id="name-error" class="error-text" role="alert"></span>
        </div>

        <div class="form-group">
          <label for="email">
            <i class="fas fa-envelope"></i> Email
          </label>
          <input 
            type="email" 
            id="email" 
            name="email"
            placeholder="tu@email.com" 
            autocomplete="email"
            required
            aria-describedby="email-error"
          >
          <span id="email-error" class="error-text" role="alert"></span>
        </div>

        <div class="form-group">
          <label for="password">
            <i class="fas fa-lock"></i> Contraseña
          </label>
          <div class="password-input-wrapper">
            <input 
              type="password" 
              id="password" 
              name="password"
              placeholder="Mínimo 6 caracteres" 
              autocomplete="new-password"
              required
              aria-describedby="password-error"
            >
            <button type="button" class="toggle-password" aria-label="Mostrar contraseña">
              <i class="fas fa-eye"></i>
            </button>
          </div>
          <span id="password-error" class="error-text" role="alert"></span>
        </div>

        <div class="form-group">
          <label for="confirmPassword">
            <i class="fas fa-lock"></i> Confirmar contraseña
          </label>
          <div class="password-input-wrapper">
            <input 
              type="password" 
              id="confirmPassword" 
              name="confirmPassword"
              placeholder="Confirma tu contraseña" 
              autocomplete="new-password"
              required
              aria-describedby="confirmPassword-error"
            >
            <button type="button" class="toggle-password" aria-label="Mostrar contraseña">
              <i class="fas fa-eye"></i>
            </button>
          </div>
          <span id="confirmPassword-error" class="error-text" role="alert"></span>
        </div>

        <div class="form-group">
          <label class="remember">
            <input type="checkbox" name="terms" id="terms" required>
            <span>Acepto los <a href="#" style="color: var(--primary-color);">términos y condiciones</a></span>
          </label>
          <span id="terms-error" class="error-text" role="alert"></span>
        </div>

        <button type="submit" class="btn-login">
          <span class="btn-text">Crear cuenta</span>
          <span class="btn-loader" aria-hidden="true"></span>
        </button>
      </form>

      <div class="divider">
        <span>O regístrate con</span>
      </div>

      <div class="social-login">
        <button type="button" class="social-btn google" aria-label="Registrarse con Google">
          <i class="fab fa-google"></i>
          <span>Google</span>
        </button>
        <button type="button" class="social-btn facebook" aria-label="Registrarse con Facebook">
          <i class="fab fa-facebook"></i>
          <span>Facebook</span>
        </button>
        <button type="button" class="social-btn apple" aria-label="Registrarse con Apple">
          <i class="fab fa-apple"></i>
          <span>Apple</span>
        </button>
      </div>

      <p id="registerError" class="error-message" role="alert" aria-live="polite"></p>

      <div class="signup-link">
        <p>¿Ya tienes cuenta? <a href="ttaa.html">Inicia sesión aquí</a></p>
      </div>
    </div>

    <div class="illustration-section">
      <div class="floating-hearts">
        <span class="heart" style="--delay: 0s">💕</span>
        <span class="heart" style="--delay: 1s">💖</span>
        <span class="heart" style="--delay: 2s">💗</span>
        <span class="heart" style="--delay: 3s">💝</span>
        <span class="heart" style="--delay: 1.5s">💓</span>
        <span class="heart" style="--delay: 2.5s">💞</span>
      </div>
      <div class="welcome-text">
        <h2>Únete a nuestra comunidad</h2>
        <p>Miles de personas ya encontraron su match perfecto. ¡Es tu turno!</p>
      </div>
    </div>
  </div>

  <script src="register.js"></script>
</body>
</html>
