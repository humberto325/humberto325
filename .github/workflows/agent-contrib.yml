name: Update AI agent contribution cards

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "tools/agent-contrib.mjs"

concurrency:
  group: profile-cards
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Render card with today's contributions
        run: node tools/agent-contrib.mjs "${{ github.repository_owner }}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit if the card changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/agent-contrib*.svg assets/agent-metrics*.svg
          git diff --cached --quiet || { git commit -m "chore: update agent contribution card" && git pull --rebase -q && git push; }
